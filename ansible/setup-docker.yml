---
- name: Provision Docker Engine and Portainer
  hosts: docker_hosts
  become: true
  vars:
    docker_user: "{{ ansible_user }}"
    # Default to 'agent'. Can be overridden at runtime with 'server' or 'none'
    portainer_mode: "agent" 

  tasks:
    - name: Update apt cache and install prerequisites
      apt:
        name:
          - ca-certificates
          - curl
          - python3-docker
        state: present
        update_cache: true

    - name: Create directory for Docker GPG key
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker official GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine, CLI, and plugins
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker service is started and enabled on boot
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Add administrative user to the docker group
      user:
        name: "{{ docker_user }}"
        groups: docker
        append: true

    # --- PORTAINER AGENT DEPLOYMENT ---
    - name: Deploy Portainer Agent connector
      community.docker.docker_container:
        name: portainer_agent
        image: portainer/agent:latest
        restart_policy: always
        published_ports:
          - "9001:9001"
        volumes:
          - "/var/run/docker.sock:/var/run/docker.sock"
          - "/var/lib/docker/volumes:/var/lib/docker/volumes"
      when: portainer_mode == 'agent'

    # --- PORTAINER SERVER DEPLOYMENT ---
    - name: Create Portainer server data volume
      community.docker.docker_volume:
        name: portainer_data
      when: portainer_mode == 'server'

    - name: Deploy Portainer Business Edition Server
      community.docker.docker_container:
        name: portainer
        image: portainer/portainer-ee:latest
        restart_policy: always
        published_ports:
          - "8000:8000"
          - "9443:9443"
        volumes:
          - "/var/run/docker.sock:/var/run/docker.sock"
          - "portainer_data:/data"
        # The default('') prevents errors if the server mode is called without a license key
        command: ["--license", "{{ portainer_license_key | default('') }}"]
      when: portainer_mode == 'server'
